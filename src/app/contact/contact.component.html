<div class="contact-popup">
  <div class="popup-content">
    <button class="close-btn" (click)="closePopup()" title="Close">
      <i class="fas fa-times"></i>
    </button>

    <h2>Get In Touch</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="contact-name">Name</label>
        <input
          type="text"
          id="contact-name"
          [(ngModel)]="name"
          name="name"
          placeholder="Your full name"
          required />
      </div>

      <div class="form-group">
        <label for="contact-email">Email</label>
        <input
          type="email"
          id="contact-email"
          [(ngModel)]="email"
          name="email"
          placeholder="your@email.com"
          required />
      </div>

      <div class="form-group">
        <label for="contact-message">Message</label>
        <textarea
          id="contact-message"
          [(ngModel)]="message"
          name="message"
          placeholder="Tell me about your project or opportunity..."
          required></textarea>
      </div>

      <button type="submit" class="submit-btn">Send Message</button>
    </form>
  </div>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" *ngIf="isLoading">
  <div class="spinner">
    <div class="orbit"></div>
    <div class="core"></div>
  </div>
  <div class="processing-text">Sending your message...</div>
</div>

<!-- Notifications -->
<div class="notification-popup" *ngIf="notsend">
  <div class="popup-content warning">
    <i class="fas fa-exclamation-circle"></i>
    <h3>Fields Required</h3>
    <p>Please fill in all required fields before sending.</p>
    <button (click)="notsend = false">Got it</button>
  </div>
</div>

<div class="notification-popup" *ngIf="notsendTechicalIssue">
  <div class="popup-content error">
    <i class="fas fa-times-circle"></i>
    <h3>Something went wrong</h3>
    <p>A technical issue occurred while sending. Please try again later.</p>
    <button (click)="notsendTechicalIssue = false">Close</button>
  </div>
</div>

<div class="notification-popup" *ngIf="notifisent">
  <div class="popup-content success">
    <i class="fas fa-check-circle"></i>
    <h3>Message Sent!</h3>
    <p>Thanks for reaching out. I'll get back to you as soon as possible.</p>
    <button (click)="notifisent = false">Close</button>
  </div>
</div>
